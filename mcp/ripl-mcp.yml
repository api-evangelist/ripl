notes: >-
  Ripl's ripl.com site is built and hosted on Wix. Wix exposes a generic site-level Model Context
  Protocol (MCP) server for every site it hosts; this is NOT a first-party Ripl product or developer
  API. It is served from Ripl's own host (www.ripl.com), advertised in Ripl's own /llms.txt, and is
  reachable anonymously, so it is a real agent surface on Ripl's domain — but the tools are Wix
  platform tools, not Ripl product operations. Ripl publishes no OpenAPI, no developer portal and no
  first-party API of its own (see x-coverage in apis.yml). The 2026-08-13 live tools/list returned 9
  tools; Ripl's llms.txt still advertises the older 7-tool set (BrowseWixRESTDocsMenu and ExecuteWixAPI
  are new, and ExecuteWixAPI is annotated destructiveHint:true).
