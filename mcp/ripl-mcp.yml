tools:
- name: GetBusinessDetails
  description: Retrieves business and site details such as timezone, email, phone, and address.
  input_schema_properties: []
- name: SearchInSite
  description: Searches the site for information.
  input_schema_properties:
  - searchTerm
- name: SearchSiteApiDocs
  description: Retrieves the API documentation for the Wix business solutions installed on this site,
    and informs the AI client how to use those APIs.
  input_schema_properties:
  - searchTerm
- name: GenerateVisitorToken
  description: Creates a new visitor session and obtains a visitor access token for the site. Must be
    called before any CallWixSiteAPI request.
  input_schema_properties: []
- name: CallWixSiteAPI
  description: Calls Wix API methods on the site to act on a visitor's behalf (query site data, book an
    appointment, start a purchase).
  input_schema_properties:
  - body
  - method
  - url
  - visitorToken
- name: ExecuteWixAPI
  description: Executes code against the Wix APIs for this site. Annotated readOnlyHint:false,
    destructiveHint:true — the only mutating tool on this surface.
  input_schema_properties:
  - code
  - hasMutations
  - reason
  - sourceDocUrls
  - visitorToken
  annotations:
    read_only: false
    destructive: true
- name: BrowseWixRESTDocsMenu
  description: Browses the Wix REST documentation menu tree.
  input_schema_properties:
  - menuUrl
  - reason
- name: ReadFullDocsArticle
  description: Fetches a complete article from the Wix developer documentation portal.
  input_schema_properties:
  - articleUrl
- name: ReadFullDocsMethodSchema
  description: Fetches the full request/response schema for a Wix API method.
  input_schema_properties:
  - articleUrl
  - reason
